<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fase 4 · Direção A — Presença</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Direção A — Presença. O retrato é o centro da tela parada; a moldura da fase 3 segue sendo o
 * indicador de vez. Estado por hash: #parado · #ouvindo · #falando (toque alterna). */
:root {
  --ck-surface-canvas: #191919; --ck-text-primary: #f2f2f2; --ck-text-secondary: #b1b1b1; --ck-text-tertiary: #868686;
  --ck-conversa-voce: #f6b84d; --ck-conversa-ze: #36caf1; --ck-conversa-prepara: #b1b1b1;
  --cor: var(--ck-conversa-prepara);
}
body.ouvindo { --cor: var(--ck-conversa-voce); }
body.falando { --cor: var(--ck-conversa-ze); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ck-text-primary);
  font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.tela { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--ck-surface-canvas); isolation: isolate; }

/* moldura: aproximação em CSS do shader da fase 3 */
.moldura { position: absolute; inset: 0; border-radius: 55px; pointer-events: none; z-index: 0;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .10), inset 0 0 14px rgb(255 255 255 / .03); transition: all .4s; }
body.ouvindo .moldura { box-shadow: inset 0 0 0 1.5px var(--cor), inset 0 0 22px color-mix(in oklch, var(--cor) 45%, transparent);
  -webkit-mask: linear-gradient(to top, #000 0%, #000 45%, transparent 80%); mask: linear-gradient(to top, #000 0%, #000 45%, transparent 80%); }
body.ouvindo .mare { opacity: 1; }
.mare { position: absolute; inset: 0; opacity: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 38% at 50% 104%, color-mix(in oklch, var(--ck-conversa-voce) 30%, transparent), transparent 70%); }
body.falando .moldura { box-shadow: inset 0 0 0 1.5px var(--cor), inset 0 0 26px color-mix(in oklch, var(--cor) 45%, transparent);
  -webkit-mask: linear-gradient(to bottom, #000 0%, #000 40%, transparent 78%); mask: linear-gradient(to bottom, #000 0%, #000 40%, transparent 78%); }
body.falando .ceu { opacity: 1; }
.ceu { position: absolute; inset: 0; opacity: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 34% at 50% -4%, color-mix(in oklch, var(--ck-conversa-ze) 26%, transparent), transparent 70%); }

.ilha { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 5; }
.hora { position: absolute; top: 21px; left: 50px; font-size: 16px; font-weight: 600; z-index: 5; }
.inicio { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #f2f2f2; opacity: .85; }

/* retrato */
.presenca { position: absolute; left: 0; right: 0; top: 214px; display: grid; justify-items: center; z-index: 1; }
.retrato { position: relative; width: 148px; height: 148px; }
.retrato img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  filter: grayscale(.9) brightness(.45) contrast(1.15); }
.retrato::after { /* vinheta: o rosto some nas bordas, o aro fica limpo */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, transparent 45%, rgb(0 0 0 / .55) 100%); }
.aro { position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--cor);
  box-shadow: 0 0 18px color-mix(in oklch, var(--cor) 55%, transparent), inset 0 0 12px color-mix(in oklch, var(--cor) 30%, transparent);
  opacity: .55; transition: all .4s; }
body.parado .aro { opacity: .35; box-shadow: none; }
body.ouvindo .aro { opacity: .9; }
.onda { position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--cor); opacity: 0; }
body.falando .aro { opacity: 1; animation: respira 1.1s ease-in-out infinite; }
body.falando .onda { animation: onda 2.4s cubic-bezier(.2,0,.2,1) infinite; }
body.falando .onda:nth-of-type(2) { animation-delay: -.8s; }
body.falando .onda:nth-of-type(3) { animation-delay: -1.6s; }
@keyframes respira { 50% { box-shadow: 0 0 34px var(--cor), inset 0 0 18px color-mix(in oklch, var(--cor) 50%, transparent); } }
@keyframes onda { from { transform: scale(1); opacity: .7; } to { transform: scale(1.5); opacity: 0; } }

.nome { margin-top: 30px; font-size: 30px; font-weight: 500; letter-spacing: -0.03em; }
.estado { margin-top: 8px; font-size: 15px; color: var(--ck-text-secondary); display: flex; align-items: center; gap: 8px; }
.estado i { width: 7px; height: 7px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 8px var(--cor); }
body.parado .estado i { box-shadow: none; opacity: .6; }

/* fala do Rica ao vivo */
.ao-vivo { position: absolute; left: 32px; right: 32px; top: 560px; z-index: 1; font-size: 22px; line-height: 1.38;
  letter-spacing: -0.012em; text-align: center; display: none; }
body.ouvindo .ao-vivo { display: block; }
.firme { color: var(--ck-text-primary); }
.provisorio { color: var(--ck-text-tertiary); }
.cursor { display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -3px; background: var(--ck-conversa-voce);
  animation: pisca 1s steps(1) infinite; }
@keyframes pisca { 50% { opacity: 0; } }

.convite { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; z-index: 1; font-size: 15px; color: var(--ck-text-secondary); }
body:not(.parado) .convite { display: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body class="parado">
<main class="tela" id="tela">
  <div class="mare"></div><div class="ceu"></div><div class="moldura"></div>
  <div class="ilha"></div><span class="hora">21:40</span>

  <section class="presenca">
    <div class="retrato">
      <img src="../../../apps/cockpit/public/avatars/daniel.webp" alt="">
      <span class="onda"></span><span class="onda"></span><span class="onda"></span>
      <span class="aro"></span>
    </div>
    <div class="nome">Daniel</div>
    <div class="estado"><i></i><span id="rotulo">disponível</span></div>
  </section>

  <p class="ao-vivo" aria-live="polite"><span class="firme">Confere se o deploy do Fluyt subiu</span> <span class="provisorio">e me diz como</span><span class="cursor"></span></p>

  <p class="convite">Toque em qualquer lugar e fale</p>
  <div class="inicio"></div>
</main>
<script>
const ROTULO = { parado: 'disponível', ouvindo: 'ouvindo você', falando: 'falando' };
const ORDEM = ['parado', 'ouvindo', 'falando'];
function aplica() { const e = ORDEM.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'parado';
  document.body.className = e; document.getElementById('rotulo').textContent = ROTULO[e]; }
addEventListener('hashchange', aplica); aplica();
document.getElementById('tela').onclick = () => { const i = ORDEM.indexOf(document.body.className); location.hash = ORDEM[(i + 1) % 3]; };
</script>
</body>
</html>
