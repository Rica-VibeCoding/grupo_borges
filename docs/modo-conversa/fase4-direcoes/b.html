<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fase 4 · Direção B — Atividade ao vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Direção B — Atividade ao vivo. O retrato vira uma "pílula" presa na ilha do iPhone (quem está na
 * linha); a esfera ocupa o palco; a fala sai grande, alinhada à esquerda, como na fase 3.
 * Estado por hash: #parado · #ouvindo · #falando (toque alterna). */
:root {
  --ck-surface-canvas: #191919; --ck-surface-composer: #2a2a2a; --ck-text-primary: #f2f2f2; --ck-text-secondary: #b1b1b1;
  --ck-text-tertiary: #868686; --ck-conversa-voce: #f6b84d; --ck-conversa-ze: #36caf1; --ck-conversa-prepara: #b1b1b1;
  --cor: var(--ck-conversa-prepara);
}
body.ouvindo { --cor: var(--ck-conversa-voce); }
body.falando { --cor: var(--ck-conversa-ze); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ck-text-primary);
  font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.tela { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--ck-surface-canvas); isolation: isolate; }

.moldura { position: absolute; inset: 0; border-radius: 55px; pointer-events: none; z-index: 3;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .09); }
body.ouvindo .moldura { box-shadow: inset 0 0 0 1.5px var(--cor), inset 0 0 22px color-mix(in oklch, var(--cor) 45%, transparent);
  -webkit-mask: linear-gradient(to top, #000 45%, transparent 82%); mask: linear-gradient(to top, #000 45%, transparent 82%); }
body.falando .moldura { box-shadow: inset 0 0 0 1.5px var(--cor), inset 0 0 26px color-mix(in oklch, var(--cor) 45%, transparent);
  -webkit-mask: linear-gradient(to bottom, #000 40%, transparent 78%); mask: linear-gradient(to bottom, #000 40%, transparent 78%); }

.ilha { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 5; }
.hora { position: absolute; top: 21px; left: 50px; font-size: 16px; font-weight: 600; z-index: 5; }
.inicio { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #f2f2f2; opacity: .85; z-index: 5; }

/* a pílula: retrato + nome + estado, colada logo abaixo da ilha */
.linha { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 12px;
  padding: 6px 18px 6px 6px; border-radius: 40px; background: rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .07);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.retrato { position: relative; width: 52px; height: 52px; flex: none; }
.retrato img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  filter: grayscale(.9) brightness(.5) contrast(1.15); }
.aro { position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--cor); opacity: .4; }
body.ouvindo .aro { opacity: .85; }
body.falando .aro { opacity: 1; animation: respira 1s ease-in-out infinite; }
.onda { position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--cor); opacity: 0; }
body.falando .onda { animation: onda 1.8s cubic-bezier(.2,0,.2,1) infinite; }
body.falando .onda + .onda { animation-delay: -.9s; }
@keyframes respira { 0%,100% { box-shadow: 0 0 6px var(--cor); } 50% { box-shadow: 0 0 20px var(--cor), 0 0 2px var(--cor) inset; } }
@keyframes onda { from { transform: scale(1); opacity: .8; } to { transform: scale(1.45); opacity: 0; } }
.quem { display: grid; gap: 1px; }
.quem b { font-size: 17px; font-weight: 500; letter-spacing: -0.015em; }
.quem small { font-size: 13px; color: var(--ck-text-secondary); display: flex; align-items: center; gap: 6px; }
.barras { display: none; gap: 2px; align-items: center; height: 12px; }
.barras i { width: 2px; border-radius: 1px; background: var(--cor); animation: barra .9s ease-in-out infinite; }
.barras i:nth-child(1) { height: 5px; animation-delay: -.2s; } .barras i:nth-child(2) { height: 11px; animation-delay: -.5s; }
.barras i:nth-child(3) { height: 8px; animation-delay: -.1s; } .barras i:nth-child(4) { height: 4px; animation-delay: -.7s; }
@keyframes barra { 50% { transform: scaleY(.4); } }
body:not(.parado) .barras { display: inline-flex; }

/* a esfera no palco */
.esfera { position: absolute; left: 50%; top: 250px; width: 250px; height: 250px; margin-left: -125px; border-radius: 50%; z-index: 1;
  background:
    radial-gradient(circle at 36% 30%, rgb(255 255 255 / .16), transparent 34%),
    radial-gradient(circle at 50% 50%, color-mix(in oklch, var(--cor) 16%, #1d1d1d) 0%, #121212 70%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06), inset 0 -24px 60px rgb(0 0 0 / .6), 0 0 80px color-mix(in oklch, var(--cor) 8%, transparent); transition: all .4s; }
.esfera::after { content: ""; position: absolute; inset: 18%; border-radius: 50%; filter: blur(22px);
  background: radial-gradient(circle, var(--cor), transparent 70%); opacity: .12; }
body.ouvindo .esfera { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--cor) 40%, transparent), inset 0 -24px 60px rgb(0 0 0 / .5), 0 0 110px color-mix(in oklch, var(--cor) 28%, transparent); transform: scale(1.04); }
body.ouvindo .esfera::after { opacity: .55; }
body.falando .esfera { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--cor) 40%, transparent), inset 0 -24px 60px rgb(0 0 0 / .5), 0 0 120px color-mix(in oklch, var(--cor) 32%, transparent); }
body.falando .esfera::after { opacity: .6; }
body.ouvindo .esfera, body.falando .esfera { top: 190px; }

/* fala ao vivo: grande, à esquerda, a 32 px da borda (contraste da moldura) */
.fala { position: absolute; left: 32px; right: 32px; top: 500px; z-index: 2; display: none; }
.fala .de { display: block; font-size: 13px; color: var(--ck-text-secondary); margin-bottom: 8px; }
.fala p { margin: 0; font-size: 27px; line-height: 1.28; letter-spacing: -0.025em; font-weight: 400; }
.firme { color: var(--ck-text-primary); }
.provisorio { color: var(--ck-text-tertiary); }
body.ouvindo .fala.voce, body.falando .fala.ze { display: block; }
.fala.ze p { color: var(--ck-text-secondary); font-size: 22px; }

.convite { position: absolute; left: 0; right: 0; top: 540px; z-index: 2; text-align: center; }
.convite b { display: block; font-size: 26px; font-weight: 400; letter-spacing: -0.025em; }
.convite span { display: block; margin-top: 10px; font-size: 15px; color: var(--ck-text-secondary); }
body:not(.parado) .convite { display: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body class="parado">
<main class="tela" id="tela">
  <div class="moldura"></div>
  <div class="ilha"></div><span class="hora">21:40</span>

  <div class="linha">
    <div class="retrato">
      <img src="../../../apps/cockpit/public/avatars/daniel.webp" alt="">
      <span class="onda"></span><span class="onda"></span><span class="aro"></span>
    </div>
    <div class="quem"><b>Daniel</b><small><span class="barras"><i></i><i></i><i></i><i></i></span><span id="rotulo">na linha</span></small></div>
  </div>

  <div class="esfera"></div>

  <div class="convite"><b>Toque para falar</b><span>Depois é só conversar</span></div>

  <div class="fala voce" aria-live="polite"><span class="de">Você</span>
    <p><span class="firme">Confere se o deploy do Fluyt subiu</span> <span class="provisorio">e me diz como ficou</span></p></div>
  <div class="fala ze"><span class="de">Daniel</span>
    <p>Subiu. O build levou dois minutos e a produção já responde.</p></div>

  <div class="inicio"></div>
</main>
<script>
const ROTULO = { parado: 'na linha', ouvindo: 'ouvindo', falando: 'falando' };
const ORDEM = ['parado', 'ouvindo', 'falando'];
function aplica() { const e = ORDEM.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'parado';
  document.body.className = e; document.getElementById('rotulo').textContent = ROTULO[e]; }
addEventListener('hashchange', aplica); aplica();
document.getElementById('tela').onclick = () => { const i = ORDEM.indexOf(document.body.className); location.hash = ORDEM[(i + 1) % 3]; };
</script>
</body>
</html>
