<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modo conversa · direção Moldura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens: espelho do globals.css de hoje + os cinco propostos para a §A. */
:root {
  --ck-surface-canvas: #191919; --ck-surface-nav: #222222; --ck-surface-composer: #2a2a2a;
  --ck-text-primary: #f2f2f2; --ck-text-secondary: #b1b1b1; --ck-text-tertiary: #868686;
  --ck-state-thinking: #9f9afc; --ck-state-running: #36caf1; --ck-state-attention: #f6b84d; --ck-state-fail: #ff7d7c;
  --ck-edge-functional: #808080; --ck-edge-hairline: #424242; --ck-focus: #40d1f7;
  --ck-touch-min: 44px; --ck-radius-caixa: 16px;
  --ck-dur-fast: 120ms; --ck-dur-calm: 320ms; --ck-ease: cubic-bezier(0.2, 0, 0.2, 1);
  /* propostos */
  --ck-conversa-voce: var(--ck-state-attention);
  --ck-conversa-pensa: var(--ck-state-thinking);
  --ck-conversa-ze: var(--ck-state-running);
  --ck-conversa-erro: var(--ck-state-fail);
  --ck-conversa-prepara: var(--ck-text-secondary);
  --proto-mesa: #0e0e0e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--proto-mesa); color: var(--ck-text-primary);
  font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.palco { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 32px; }
.tela { position: relative; width: 393px; height: 852px; flex: none; overflow: hidden; border-radius: 55px;
  background: var(--ck-surface-canvas); isolation: isolate; }
@media (max-width: 520px) {
  .palco { padding: 0; } .painel { display: none; }
  .tela { width: 100vw; height: 100dvh; border-radius: 0; }
}
.sem-painel .palco { padding: 0; } .sem-painel .painel { display: none; }
.sem-painel .tela { border-radius: 0; }

#luz { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }

/* moldura de iPhone só para a captura: ilha e barra de início */
.ilha { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px;
  border-radius: 20px; background: #000; }
.hora { position: absolute; top: 21px; left: 50px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.inicio { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px;
  border-radius: 3px; background: var(--ck-text-primary); opacity: .85; }

.topo { position: absolute; top: 59px; left: 12px; right: 24px; height: 44px; display: flex;
  align-items: center; justify-content: space-between; }
.voltar { display: inline-flex; align-items: center; gap: 2px; min-height: var(--ck-touch-min); padding: 0 12px 0 6px;
  border: 0; border-radius: 12px; background: transparent; color: var(--ck-text-secondary); font: inherit; font-size: 16px; }
.voltar svg { width: 22px; height: 22px; }
.agente { color: var(--ck-text-secondary); font-size: 15px; }

.leitura { position: absolute; left: 28px; right: 28px; top: 212px; }
.linha-titulo { display: flex; align-items: baseline; gap: 14px; }
h1 { margin: 0; font-size: 50px; line-height: 1.02; font-weight: 500; letter-spacing: -0.035em; }
.tempo { font-size: 22px; font-weight: 400; color: var(--ck-text-secondary); font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em; }
.detalhe { margin: 16px 0 0; max-width: 300px; font-size: 17px; line-height: 1.45; color: var(--ck-text-secondary); }

.falas { position: absolute; left: 28px; right: 28px; top: 430px; display: grid; gap: 22px; }
.fala { transition: opacity var(--ck-dur-calm) var(--ck-ease); }
.fala[hidden] { display: none; }
.quem { display: block; font-size: 13px; color: var(--ck-text-secondary); margin-bottom: 6px; }
.fala p { margin: 0; font-size: 20px; line-height: 1.38; letter-spacing: -0.01em; }
.fala.recuada p { font-size: 16px; color: var(--ck-text-secondary); }
.fala.pausada p { color: var(--ck-text-secondary); }
.reticencias span { display: inline-block; animation: pisca 1.2s infinite var(--ck-ease); }
.reticencias span:nth-child(2) { animation-delay: .2s; } .reticencias span:nth-child(3) { animation-delay: .4s; }
@keyframes pisca { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

.comandos { position: absolute; left: 20px; right: 20px; bottom: 40px; display: grid; gap: 12px; }
.fone { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px;
  border-radius: var(--ck-radius-caixa); background: var(--ck-surface-composer); cursor: pointer; }
.fone svg { width: 24px; height: 24px; flex: none; color: var(--ck-text-secondary); }
.fone .rotulo { flex: 1; display: grid; gap: 2px; }
.fone b { font-weight: 500; font-size: 16px; }
.fone small { font-size: 13px; color: var(--ck-text-secondary); }
.fone input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chave { position: relative; width: 51px; height: 31px; flex: none; border-radius: 16px;
  background: var(--ck-edge-hairline); transition: background var(--ck-dur-fast) var(--ck-ease); }
.chave::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: var(--ck-text-primary); transition: transform var(--ck-dur-fast) var(--ck-ease); }
.fone input:checked + .chave { background: var(--ck-text-primary); }
.fone input:checked + .chave::after { background: var(--ck-surface-canvas); }
.fone input:checked + .chave::after { transform: translateX(20px); }
.fone input:focus-visible + .chave { outline: 2px solid var(--ck-focus); outline-offset: 2px; }
.acao { min-height: 56px; border-radius: 28px; border: 1px solid var(--ck-edge-functional); background: var(--ck-surface-canvas);
  color: var(--ck-text-primary); font: inherit; font-size: 17px; font-weight: 500; }
.acao.primaria { background: var(--ck-text-primary); border-color: var(--ck-text-primary); color: var(--ck-surface-canvas); }
.acao:disabled { color: var(--ck-text-secondary); border-color: var(--ck-edge-hairline); background: var(--ck-surface-composer); }

.painel { width: 260px; display: grid; gap: 8px; font-size: 14px; color: var(--ck-text-secondary); }
.painel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 500; color: var(--ck-text-primary); }
.painel p { margin: 0 0 12px; line-height: 1.45; }
.painel button { text-align: left; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--ck-edge-hairline);
  background: transparent; color: var(--ck-text-primary); font: inherit; }
.painel button[aria-pressed="true"] { border-color: var(--ck-text-primary); }
.painel label { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.painel a { color: var(--ck-text-primary); }

@media (prefers-reduced-motion: reduce) { .reticencias span { animation: none; opacity: .6; } }
.reduzido .reticencias span { animation: none; opacity: .6; }
</style>
</head>
<body>
<div class="palco">
  <main class="tela" id="tela">
    <canvas id="luz" aria-hidden="true"></canvas>
    <div class="ilha" aria-hidden="true"></div><span class="hora" aria-hidden="true">21:40</span>
    <header class="topo">
      <button class="voltar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Voltar</button>
      <span class="agente">canarinho</span>
    </header>
    <section class="leitura" aria-live="polite">
      <div class="linha-titulo"><h1 id="titulo">Conversa por voz</h1><span class="tempo" id="tempo"></span></div>
      <p class="detalhe" id="detalhe"></p>
    </section>
    <section class="falas">
      <div class="fala" id="falaVoce" hidden><span class="quem">Você disse</span><p id="textoVoce"></p></div>
      <div class="fala" id="falaZe" hidden><span class="quem">canarinho</span><p id="textoZe"></p></div>
    </section>
    <footer class="comandos">
      <label class="fone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 16a2 2 0 0 1-2 2h-1a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3zM3 16a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H3z"/></svg>
        <span class="rotulo"><b>Estou de fone</b><small id="foneDica"></small></span>
        <input type="checkbox" role="switch" id="fone"><span class="chave" aria-hidden="true"></span>
      </label>
      <button class="acao" id="acao" type="button">Encerrar conversa</button>
    </footer>
    <div class="inicio" aria-hidden="true"></div>
  </main>
  <aside class="painel" id="painel">
    <h2>Moldura</h2>
    <p>A borda da tela é o indicador. Luz subindo do pé: sua vez. Luz descendo do topo: ele fala. Luz girando: ele pensa.</p>
  </aside>
</div>

<script>
/* ===================== simulação (igual nas três direções) ===================== */
const P = new URLSearchParams(location.search);
if (P.get('painel') === '0') document.body.classList.add('sem-painel');
const ESTADOS = ['parado', 'preparando', 'ouvindo', 'transcrevendo', 'esperandoZe', 'falando', 'interrompendo', 'erro'];
const NOMES = { parado: 'parado', preparando: 'preparando', ouvindo: 'ouvindo', transcrevendo: 'transcrevendo',
  esperandoZe: 'esperando o Zé', falando: 'falando', interrompendo: 'interrompendo', erro: 'erro' };
const ROTEIROS = {
  normal: [['parado', 1.2], ['preparando', 3.0], ['ouvindo', 4.4], ['transcrevendo', 0.8], ['esperandoZe', 2.8],
    ['falando', 3.8], ['interrompendo', 1.8], ['erro', 2.6]],
  rapido: [['preparando', 1.3], ['ouvindo', 2.3], ['transcrevendo', 0.4], ['esperandoZe', 1.4], ['falando', 2.0],
    ['interrompendo', 1.2], ['erro', 1.2]],
};
const VOCE = '“Confere se o deploy do Fluyt subiu e me diz como ficou.”';
const ZE = 'Subiu. O build levou dois minutos e a produção já responde na 3008.';
const sim = { t: 0, estado: 'parado', tEstado: 0, nivel: 0, fone: false, fala: false, silencio: 0,
  prog: 0, travado: P.get('estado'), roteiro: ROTEIROS[P.get('roteiro')] || ROTEIROS.normal, passoRoteiro: 0,
  reduzido: matchMedia('(prefers-reduced-motion: reduce)').matches || P.get('movimento') === 'reduzido' };
if (sim.reduzido) document.body.classList.add('reduzido');

function ruido(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const h = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  return h(i) * (1 - u) + h(i + 1) * u; }
function envelope(t, sem, ritmo) {
  const silaba = Math.pow(Math.max(0, Math.sin(t * 6.2832 * ritmo + sem)), 0.6);
  return Math.min(1, (0.22 + 0.78 * silaba) * (0.35 + 0.65 * ruido(t * 2.3 + sem * 10)) * (0.6 + 0.55 * ruido(t * 0.7 + sem * 20)));
}
/* janela de fala dentro de "ouvindo": [início, fim] em s; depois disso é o silêncio que encerra (1,4 s) */
function janelaDeFala(dur) { return dur >= 4 ? [0.3, dur - 1.4] : [0.15, dur * 0.55]; }
function duracaoAtual() { return sim.travado ? null : sim.roteiro[sim.passoRoteiro][1]; }
function entra(estado) { sim.estado = estado; sim.tEstado = 0; sim.fone = estado !== 'preparando' && estado !== 'parado';
  if (sim.travado === 'preparando') sim.fone = false; aoMudarEstado(); }
function passo(dt) {
  sim.t += dt; sim.tEstado += dt;
  const dur = duracaoAtual();
  if (dur !== null && sim.tEstado >= dur) {
    sim.passoRoteiro = (sim.passoRoteiro + 1) % sim.roteiro.length; entra(sim.roteiro[sim.passoRoteiro][0]); }
  let alvo = 0; sim.fala = false; sim.silencio = 0;
  if (sim.estado === 'ouvindo') {
    const ciclo = dur ?? 4.4; const tl = sim.travado ? sim.tEstado % ciclo : sim.tEstado;
    const [a, b] = janelaDeFala(ciclo);
    if (tl >= a && tl <= b) { sim.fala = true; alvo = envelope(sim.t, 1, 4.3); }
    else if (tl > b) { sim.fala = true; sim.silencio = (tl - b) / (ciclo - b); alvo = 0.015; }
  } else if (sim.estado === 'interrompendo') { alvo = envelope(sim.t, 2, 4.6); sim.fala = true; }
  else if (sim.estado === 'falando') { alvo = 0.15 + 0.85 * envelope(sim.t, 3, 3.6); }
  const k = alvo > sim.nivel ? 0.45 : 0.11;
  sim.nivel += (alvo - sim.nivel) * (1 - Math.pow(1 - k, dt * 60));
  if (sim.estado === 'preparando') sim.prog = Math.min(1, sim.tEstado / (dur ?? 8));
  if (sim.reduzido) sim.nivel = alvo > 0.01 ? 0.5 : 0;
  aoPasso(dt);
}
/* API da captura: avança o relógio simulado até T (em passos de 1/60 s) e desenha um quadro */
window.__irPara = (T) => { while (sim.t < T - 1e-6) passo(Math.min(1 / 60, T - sim.t)); desenha(); atualizaNumeros(); window.__pronto = true; };
function inicia() {
  if (sim.travado) entra(sim.travado); else entra(sim.roteiro[0][0]);
  preparaVisual();
  if (P.get('manual') === '1') { window.__capturaPadrao = CAPTURA[sim.estado] ?? 1; window.__pronto = true; return; }
  let antes = performance.now();
  const laco = (agora) => { const dt = Math.min(0.05, (agora - antes) / 1000); antes = agora; passo(dt);
    const seg = Math.floor(sim.t); if (!sim.reduzido || precisaRedesenhar || seg !== ultimoSegundo) { desenha(); precisaRedesenhar = false; ultimoSegundo = seg; }
    atualizaNumeros(); requestAnimationFrame(laco); };
  requestAnimationFrame(laco);
}
let precisaRedesenhar = true, ultimoSegundo = -1;

/* painel de demonstração (só no PC) */
function montaPainel() {
  const painel = document.getElementById('painel');
  const auto = document.createElement('button'); auto.textContent = 'Automático (roteiro)';
  auto.setAttribute('aria-pressed', String(!sim.travado));
  auto.onclick = () => { location.search = ''; }; painel.append(auto);
  for (const e of ESTADOS) { const b = document.createElement('button'); b.textContent = NOMES[e];
    b.setAttribute('aria-pressed', String(sim.travado === e));
    b.onclick = () => { const q = new URLSearchParams(location.search); q.set('estado', e); location.search = q; }; painel.append(b); }
  const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox'; c.checked = sim.reduzido;
  c.onchange = () => { const q = new URLSearchParams(location.search); c.checked ? q.set('movimento', 'reduzido') : q.delete('movimento'); location.search = q; };
  l.append(c, 'Movimento reduzido'); painel.append(l);
  const o = document.createElement('p'); o.innerHTML = 'Outras: <a href="mostrador.html">Mostrador</a> · <a href="nucleo.html">Núcleo</a>'; painel.append(o);
}

/* ===================== textos (comuns) ===================== */
const $ = (id) => document.getElementById(id);
function textos() {
  const e = sim.estado;
  const T = {
    parado: ['Conversa por voz', 'Um toque para começar. Depois é só falar.'],
    preparando: ['Preparando', 'Baixando o detector de voz neste iPhone.'],
    ouvindo: [sim.fala ? 'Estou ouvindo' : 'Pode falar', sim.fala ? 'Quando você parar, eu envio.' : 'O microfone está aberto.'],
    transcrevendo: ['Entendendo', 'Passando sua fala para texto.'],
    esperandoZe: ['Pensando', 'A resposta toca assim que chegar.'],
    falando: ['Respondendo', 'Quando ele terminar, volto a ouvir.'],
    interrompendo: ['Pausei a resposta', 'Continue falando para interromper. Se foi tosse, eu retomo.'],
    erro: ['O microfone desligou', 'A tela bloqueou e o iPhone cortou o microfone.'],
  };
  return T[e];
}
let ultimoTitulo = '';
function aoMudarEstado() {
  const e = sim.estado; const [t, d] = textos(); ultimoTitulo = t; $('tela').dataset.estado = e;
  $('titulo').textContent = t; $('detalhe').textContent = d;
  $('fone').checked = sim.fone;
  $('foneDica').textContent = sim.fone ? 'Falar por cima interrompe a resposta.' : 'Espero a resposta terminar.';
  const voce = $('falaVoce'), ze = $('falaZe');
  voce.hidden = !['transcrevendo', 'esperandoZe', 'falando', 'interrompendo', 'erro'].includes(e);
  ze.hidden = !['falando', 'interrompendo'].includes(e);
  $('textoVoce').innerHTML = e === 'transcrevendo' ? '<span class="reticencias"><span>•</span><span>•</span><span>•</span></span>' : VOCE;
  $('textoZe').textContent = ZE;
  voce.classList.toggle('recuada', e === 'falando' || e === 'interrompendo');
  ze.classList.toggle('pausada', e === 'interrompendo');
  const acao = $('acao');
  acao.disabled = e === 'preparando';
  acao.classList.toggle('primaria', e === 'parado' || e === 'erro');
  acao.textContent = e === 'parado' ? 'Começar conversa' : e === 'erro' ? 'Retomar conversa' : e === 'preparando' ? 'Preparando…' : 'Encerrar conversa';
  precisaRedesenhar = true; pulso = sim.reduzido ? 0 : 1;
}
let ultimoNumero = '';
function atualizaNumeros() {
  const e = sim.estado;
  const n = e === 'preparando' ? `${Math.round(sim.prog * 100)}%` : e === 'esperandoZe' ? `${Math.floor(sim.tEstado)} s` : '';
  if (n !== ultimoNumero) { $('tempo').textContent = n; ultimoNumero = n; }
  if (e === 'preparando') { const mb = (sim.prog * 3.6).toFixed(1).replace('.', ',');
    const d = `Baixando o detector de voz: ${mb} de 3,6 MB.`; if ($('detalhe').textContent !== d) $('detalhe').textContent = d; }
  const [t] = textos(); if (t !== ultimoTitulo) { ultimoTitulo = t; $('titulo').textContent = t; $('detalhe').textContent = textos()[1]; }
}

/* ===================== visual da Moldura: WebGL cru, um fragment shader ===================== */
const CAPTURA = { preparando: 5, ouvindo: 1.9, transcrevendo: 0.5, esperandoZe: 7.3, falando: 3.1, interrompendo: 0.9, erro: 1.2, parado: 1 };
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uDpr, uRaio, uT, uNivel, uProg, uOrbita, uCauda, uPulso;
uniform vec4 uA; uniform vec4 uB;
uniform vec3 uFundo, uVoce, uZe, uPensa, uPrepara, uErro, uCorPulso;
float sdRR(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float tremor(float a, float t) { return .5 + .25 * sin(a * 3. + t * 1.3) + .15 * sin(a * 7. - t * 2.1) + .1 * sin(a * 13. + t * 3.7); }
void main() {
  vec2 p = gl_FragCoord.xy - .5 * uRes; vec2 b = .5 * uRes;
  float d = max(-sdRR(p, b, uRaio), 0.) / uDpr;        /* distância da borda, em px CSS */
  float ang = atan(p.x, p.y);                           /* 0 no topo, cresce no sentido horário */
  float ny = p.y / b.y;                                 /* +1 topo, -1 pé */
  float fio = exp(-d / 1.8), perto = exp(-d / 11.), medio = exp(-d / 26.), longe = exp(-d / 48.);
  vec3 c = vec3(0.);
  /* você: maré que sobe do pé, alcance e largura pelo volume do microfone */
  float alc = mix(-.62, .28, uNivel) + .16 * uNivel * (tremor(ang * 1.7, uT * 1.6) - .5);
  float mv = smoothstep(alc + .35, alc - .25, ny);
  float wv = mix(26., 86., uNivel);
  c += uVoce * uA.x * mv * (exp(-d / wv) * (.3 + .9 * uNivel) * (.7 + .6 * tremor(ang, uT)) + perto * .45 + fio * .9);
  /* ele: luz que desce do topo em faixas, pelo volume da voz */
  float alz = mix(.62, -.28, uNivel);
  float mz = smoothstep(alz - .35, alz + .25, ny);
  float faixas = .55 + .45 * sin(ny * 10. + uT * 2.8);
  c += uZe * uA.y * mz * (exp(-d / wv) * (.3 + .9 * uNivel) * faixas + perto * .45 + fio * .9);
  /* pensando: cometa que orbita a moldura; a cauda cresce com a espera */
  float delta = mod(uOrbita - ang + 12.566, 6.2832);
  float cometa = max(exp(-delta / uCauda), exp(-(6.2832 - delta) / .05));
  float delta2 = mod(uOrbita + 3.1416 - ang + 12.566, 6.2832);
  cometa += .45 * max(exp(-delta2 / (uCauda * .5)), exp(-(6.2832 - delta2) / .05));
  c += uPensa * uA.z * (fio * (.22 + 1.2 * cometa) + perto * cometa * .9 + medio * cometa * .8);
  /* preparando: o traço desenha a moldura até o progresso do download */
  float f = mod(ang + 6.2832, 6.2832) / 6.2832;
  float feito = smoothstep(uProg + .003, uProg - .003, f);
  float ponta = exp(-abs(f - uProg) * 60.);
  c += uPrepara * uA.w * (fio * (.1 + .9 * feito) + perto * .35 * feito + (perto + medio) * ponta * 1.1);
  /* erro: moldura parada, com a falha no pé (onde fica o microfone) */
  float falha = smoothstep(.10, .20, 3.1416 - abs(ang));
  c += uErro * uB.x * falha * (fio + perto * .5 + longe * .3);
  /* interrompendo: a voz dele congela no topo, apagada */
