# Hooks do Codex no Windows (lições de 04/08, placar 6/6):
# - O campo `command` roda via cmd.exe /C — sintaxe bash falha com "exited with code 1".
#   O campo irmão `commandWindows` é obrigatório: bash do Git + caminho absoluto.
# - Sessão interativa NÃO relê este arquivo depois de editado: hook novo/alterado
#   só carrega em sessão nova (codex exec passa porque nasce lendo a config nova).

[[hooks.SessionStart]]
matcher = "startup|resume"

  [[hooks.SessionStart.hooks]]
  type = "command"
  command = "t=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0; [ -f \"$t/.claude/hooks/check-git-updates.sh\" ] || exit 0; exec bash \"$t/.claude/hooks/check-git-updates.sh\""
  commandWindows = 'C:\PROGRA~1\Git\bin\bash.exe C:\Users\RicardoBorges\Documents\dev\projetos\cockpit-x\.claude\hooks\check-git-updates.sh'
  timeout = 15

[[hooks.UserPromptSubmit]]

  [[hooks.UserPromptSubmit.hooks]]
  type = "command"
  command = "t=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0; [ -f \"$t/.codex/hooks/psmux-canal-load-skill.sh\" ] || exit 0; exec bash \"$t/.codex/hooks/psmux-canal-load-skill.sh\""
  commandWindows = 'C:\PROGRA~1\Git\bin\bash.exe C:\Users\RicardoBorges\Documents\dev\projetos\cockpit-x\.codex\hooks\psmux-canal-load-skill.sh'
  timeout = 5
  additionalContextLimit = 500
